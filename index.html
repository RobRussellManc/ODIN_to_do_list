<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <title> To Do list </title>
</head>
<body>
    <script src="ToDoList.js" type="module"></script>
    <container>
        <leftbar>
            <projects>
                <h1 class="your_projects">Your Projects</h1>
                <list_projects>

                </list_projects>

            </projects>
            <add_proj>
                <form class="newProject">
                    <div>
                    <label for="newProject">Add project:</label>
                    <input type="text" id="newProject" name="newProject" />
                    </div>
                    
                   
                    <button type="button" style="background: url(images/plus.svg); background-size: cover" id="project_submit"></button>
                </form>
                
                <div>
                   
                </div>

            </add_proj>
        </leftbar> 
        
        <rightbar>
            <top_bar>
                <display_project>
                    <span class="display_project"></span>

                </display_project>
                <display_username>
                    <span class="greeting">
                    Welcome, <span class="display_username"></span>
                    </span>
                </display_username>
            </top_bar>
            <completed_toggle_button>

            </completed_toggle_button>
            <tasks>
                <task_main_box>
                    <p class="welcome-text">
                    Welcome to this to-do list appplication. To get started, select a project on the left. 
                    The tasks within each project will be displayed here. 
                    </p>
                    <p class="welcome-text">
                    Use the forms belows to add new projects or tasks.
                    </p>
                </task_main_box>
                <page_buttons>
                    <button id="prev-page" disabled >Previous page</button>
                    <button id="next-page">Next Page</button>
                    <span class="display_page_number"></span>
                </page_buttons>
            </tasks>
            <add_task>
                <form class="addTask">
                    <div>
                        <label for="taskTitle" required>Task title</label>
                        <input type="text" id="taskTitle" name="taskTitle" />
                    </div>
                    <div>
                        <label for="taskDesc">Task description</label>
                        <input type="text" id="taskDesc" name="taskDesc" />
                    </div>
                    <div>
                        <label for="taskPriority">Priority</label>
                        <input type="text" id="taskPriority" name="taskPriority" />
                    </div>

                    <button type="button" style="background: url(images/plus.svg); background-size: cover" id="task_submit"></button>
                    <!--
                    <button id="task_submit" type="button">
                        <img src="images/plus.svg" id="add_button_icon">
                    </button>
                    -->
                </form>

            </add_task>
        </rightbar>
    </container>

</body>
</html>
